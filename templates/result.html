<!DOCTYPE html>
<html>
<head>
    <title>DFA Equivalence Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* Explanation Box */
        #aiExplanationBox {
            margin-top: 40px;
            padding: 30px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 10px 32px rgba(0,0,0,0.12);
            display: none;
            font-size: 16px;
            line-height: 1.7;
        }
        #aiExplanationBox h1,
        #aiExplanationBox h2,
        #aiExplanationBox h3,
        #aiExplanationBox h4 {
            margin-top: 18px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #1f3c88;
        }
        #aiExplanationBox p { margin-bottom: 10px; }

        .highlight {
            animation: flash 1.2s ease;
        }
        @keyframes flash {
            0% { box-shadow: 0 0 0px rgba(31,60,136,0.1); }
            50% { box-shadow: 0 0 25px rgba(31,60,136,0.4); }
            100% { box-shadow: 0 0 0px rgba(31,60,136,0.1); }
        }

        /* Chat box */
        #aiChatBox {
            margin-top: 25px;
            padding: 20px 24px;
            border-radius: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        #aiChatBox h4 {
            color: #1f3c88;
            margin-bottom: 12px;
        }
        .chat-messages {
            max-height: 260px;
            overflow-y: auto;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 15px;
        }
        .chat-message.user {
            align-self: flex-end;
            background: #e0edff;
        }
        .chat-message.ai {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }
        .chat-input {
            margin-top: 10px;
        }

        /* Small loader text */
        #loadingText {
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container" style="max-width:980px; margin-top:30px;">
    <h1 class="text-center mb-4">Result</h1>

    {% if equivalent %}
        <p class="text-center text-success fs-4">✅ The DFAs are equivalent.</p>
    {% else %}
        <p class="text-center text-danger fs-4">❌ The DFAs are NOT equivalent.</p>
        <p class="text-center fs-5">Counterexample string: <strong>{{ counterexample }}</strong></p>
    {% endif %}

    <div class="row mt-4">
        <div class="col-md-6 text-center">
            <h3>DFA 1</h3>
            <img src="{{ img1 }}" alt="DFA 1">
        </div>
        <div class="col-md-6 text-center">
            <h3>DFA 2</h3>
            <img src="{{ img2 }}" alt="DFA 2">
        </div>
    </div>

    <!-- Buttons row -->
    <div class="d-flex justify-content-center gap-3 mt-4 mb-1">
        <button id="aiExplainBtn" class="btn btn-success">
            🤖 Explain with AI
        </button>

        <a href="/" class="btn btn-primary">
            Check Another DFA
        </a>
    </div>

    <!-- AI Explanation Section -->
    <div id="aiExplanationBox">
        <h3>🤖 AI Explanation</h3>
        <hr>
        <div id="aiText">Generating explanation...</div>
    </div>

    <!-- Chat Section -->
    <div id="aiChatBox" style="display:none;">
        <h4>💬 Ask AI more questions</h4>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input d-flex">
            <input type="text" id="chatInput" class="form-control" placeholder="Ask anything about these DFAs or automata..." />
            <button id="chatSendBtn" class="btn btn-outline-primary ms-2">Send ➤</button>
        </div>
    </div>
</div>

<script>
// Make DFA data available globally for both explanation and chat
const dfa1 = {{ raw1|tojson }};
const dfa2 = {{ raw2|tojson }};
const equivalent = {{ 'true' if equivalent else 'false' }};
const counterexample = {{ counterexample|tojson }};

// ------------ AI Explanation ------------
document.getElementById("aiExplainBtn").addEventListener("click", function () {
    const payload = { dfa1, dfa2, equivalent, counterexample };

    let box = document.getElementById("aiExplanationBox");
    box.style.display = "block";
    box.classList.add("highlight");

    document.getElementById("aiText").innerHTML =
        `<span id="loadingText">Generating explanation</span>`;

    let dotCount = 0;
    let loaderInterval = setInterval(() => {
        dotCount = (dotCount + 1) % 4;
        document.getElementById("loadingText").innerText =
            "Generating explanation" + ".".repeat(dotCount);
    }, 350);

    box.scrollIntoView({ behavior: "smooth" });

    fetch("/ai_explain", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        clearInterval(loaderInterval);
        if (data.explanation) {
            document.getElementById("aiText").innerHTML = data.explanation;
            // Show chat box after explanation is ready
            document.getElementById("aiChatBox").style.display = "block";
        } else {
            document.getElementById("aiText").innerHTML = "Error: " + data.error;
        }
    });
});

// ------------ Chat With AI ------------
const chatInput = document.getElementById("chatInput");
const chatSendBtn = document.getElementById("chatSendBtn");
const chatMessages = document.getElementById("chatMessages");

function appendMessage(sender, htmlOrText, isHtml=false) {
    const div = document.createElement("div");
    div.className = "chat-message " + (sender === "user" ? "user" : "ai");
    if (isHtml) {
        div.innerHTML = htmlOrText;
    } else {
        div.innerText = htmlOrText;
    }
    chatMessages.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function sendChat() {
    const msg = chatInput.value.trim();
    if (!msg) return;

    appendMessage("user", msg, false);
    chatInput.value = "";
    chatInput.focus();

    // temporary loader message
    const loaderDiv = document.createElement("div");
    loaderDiv.className = "chat-message ai";
    loaderDiv.id = "aiChatLoading";
    loaderDiv.innerHTML = `<span id="loadingText">Thinking</span>`;
    chatMessages.appendChild(loaderDiv);
    loaderDiv.scrollIntoView({ behavior: "smooth", block: "end" });

    let dotCount = 0;
    let loaderInterval = setInterval(() => {
        dotCount = (dotCount + 1) % 4;
        document.getElementById("loadingText").innerText =
            "Thinking" + ".".repeat(dotCount);
    }, 350);

    const payload = { message: msg, dfa1, dfa2 };

    fetch("/ai_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        clearInterval(loaderInterval);
        loaderDiv.remove();
        if (data.reply) {
            appendMessage("ai", data.reply, true);
        } else {
            appendMessage("ai", "Error: " + data.error, false);
        }
    });
}

chatSendBtn.addEventListener("click", sendChat);
chatInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        sendChat();
    }
});
</script>

</body>
</html>
